[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abalone-age-prediction"
version = "1.0.0"
description = "Reproducible abalone age prediction pipeline with reporting and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "dill==0.3.8",
    "dash==2.16.1",
    "dash-bootstrap-components==1.5.0",
    "dash-core-components==2.0.0",
    "dash-html-components==2.0.0",
    "dash-table==5.0.0",
    "explainerdashboard==0.4.7",
    "Flask==3.0.2",
    "joblib==1.3.2",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "plotly==5.20.0",
    "scikit-learn==1.4.1.post1",
    "scipy==1.13.0",
    "seaborn==0.13.2",
    "shap==0.45.0",
    "waitress==3.0.0",
    "Werkzeug==3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
abalone = "abalone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
